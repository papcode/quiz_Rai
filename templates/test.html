{% extends "base.html" %}

{% block content %}
<div class="quiz-container">
    <div class="quiz-wrapper">
        <div class="quiz-header">
            <div class="quiz-progress">
                <div class="progress-text">
                    <span>Question Progress</span>
                    <span class="question-counter">1/{{ questions|length }}</span>
                </div>
                <div class="progress-bar">
                    <div class="progress" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <form id="quizForm" method="POST">
            <div class="question-container">
                {% for question in questions %}
                <div class="question-card {% if loop.first %}active{% endif %}" data-question="{{ loop.index }}">
                    <div class="question-content">
                        <div class="question-number">Question {{ loop.index }}</div>
                        <h3 class="question-text">{{ question.question }}</h3>
                        
                        <div class="options-container">
                            <label class="option-card" for="yes_{{ loop.index }}">
                                <input type="radio" id="yes_{{ loop.index }}" name="answers[{{ loop.index0 }}]" value="1" required>
                                <div class="option-content">
                                    <div class="option-icon">
                                        <i class="fas fa-check"></i>
                                    </div>
                                    <span class="option-text">Yes</span>
                                </div>
                            </label>

                            <label class="option-card" for="no_{{ loop.index }}">
                                <input type="radio" id="no_{{ loop.index }}" name="answers[{{ loop.index0 }}]" value="2" required>
                                <div class="option-content">
                                    <div class="option-icon">
                                        <i class="fas fa-times"></i>
                                    </div>
                                    <span class="option-text">No</span>
                                </div>
                            </label>
                        </div>
                    </div>
                </div>
                {% endfor %}
            </div>

            <button type="submit" id="submit-btn" class="submit-btn disabled" disabled>
                <span>Submit Answers</span>
                <i class="fas fa-arrow-right"></i>
            </button>
        </form>
    </div>
</div>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

.quiz-container {
    min-height: 100vh;
    background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    padding: 40px 20px;
    font-family: 'Poppins', sans-serif;
}

.quiz-wrapper {
    max-width: 800px;
    margin: 0 auto;
    background: white;
    border-radius: 20px;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
    padding: 40px;
}

.quiz-header {
    margin-bottom: 40px;
}

.quiz-progress {
    margin-bottom: 30px;
}

.progress-text {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    color: #666;
    font-weight: 500;
}

.question-counter {
    color: #4CAF50;
    font-weight: 600;
}

.progress-bar {
    height: 6px;
    background: #eee;
    border-radius: 3px;
    overflow: hidden;
}

.progress {
    height: 100%;
    background: linear-gradient(to right, #4CAF50, #45a049);
    transition: width 0.5s ease;
}

.question-container {
    position: relative;
    min-height: 400px;
}

.question-card {
    position: absolute;
    width: 100%;
    opacity: 0;
    transform: translateX(100px);
    transition: all 0.5s ease;
    visibility: hidden;
}

.question-card.active {
    opacity: 1;
    transform: translateX(0);
    visibility: visible;
}

.question-card.slide-out {
    opacity: 0;
    transform: translateX(-100px);
}

.question-content {
    text-align: center;
    padding: 20px;
}

.question-number {
    color: #4CAF50;
    font-weight: 600;
    margin-bottom: 15px;
    font-size: 18px;
}

.question-text {
    font-size: 24px;
    color: #333;
    margin-bottom: 40px;
    line-height: 1.4;
}

.options-container {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 30px;
}

.option-card {
    flex: 1;
    max-width: 200px;
    cursor: pointer;
}

.option-card input[type="radio"] {
    display: none;
}

.option-content {
    background: #f8f9fa;
    border: 2px solid #eee;
    border-radius: 15px;
    padding: 20px;
    text-align: center;
    transition: all 0.3s ease;
}

.option-icon {
    font-size: 24px;
    color: #666;
    margin-bottom: 10px;
}

.option-text {
    font-size: 18px;
    color: #333;
    font-weight: 500;
}

.option-card:hover .option-content {
    transform: translateY(-5px);
    border-color: #4CAF50;
}

.option-card input[type="radio"]:checked + .option-content {
    background: #4CAF50;
    border-color: #4CAF50;
    transform: translateY(-5px);
}

.option-card input[type="radio"]:checked + .option-content .option-icon,
.option-card input[type="radio"]:checked + .option-content .option-text {
    color: white;
}

.submit-btn {
    display: none;
    width: 100%;
    padding: 15px;
    background: #4CAF50;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.3s ease;
    margin-top: 30px;
    align-items: center;
    justify-content: center;
    gap: 10px;
}

.submit-btn.disabled {
    background: #cccccc;
    cursor: not-allowed;
}

.submit-btn:not(.disabled):hover {
    background: #45a049;
    transform: translateY(-2px);
}

@media (max-width: 600px) {
    .quiz-wrapper {
        padding: 20px;
    }

    .options-container {
        flex-direction: column;
        align-items: center;
    }

    .option-card {
        width: 100%;
        max-width: 100%;
    }

    .question-text {
        font-size: 20px;
    }
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const questionCards = document.querySelectorAll('.question-card');
    const progressBar = document.querySelector('.progress');
    const questionCounter = document.querySelector('.question-counter');
    const submitBtn = document.getElementById('submit-btn');
    const totalQuestions = questionCards.length;
    let currentQuestion = 1;

    function updateProgress() {
        const progress = (currentQuestion / totalQuestions) * 100;
        progressBar.style.width = `${progress}%`;
        questionCounter.textContent = `${currentQuestion}/${totalQuestions}`;
    }

    function showNextQuestion() {
        const currentCard = document.querySelector(`.question-card[data-question="${currentQuestion}"]`);
        const nextCard = document.querySelector(`.question-card[data-question="${currentQuestion + 1}"]`);

        if (currentCard) {
            currentCard.classList.add('slide-out');
            setTimeout(() => {
                currentCard.classList.remove('active');
                currentCard.classList.remove('slide-out');
            }, 500);
        }

        if (nextCard) {
            setTimeout(() => {
                nextCard.classList.add('active');
                currentQuestion++;
                updateProgress();
            }, 500);
        }

        if (currentQuestion >= totalQuestions - 1) {
            submitBtn.style.display = 'flex';
            submitBtn.classList.add('disabled');
            submitBtn.disabled = true;
        }
    }

    document.querySelectorAll('input[type="radio"]').forEach(radio => {
        radio.addEventListener('change', function() {
            const questionCard = this.closest('.question-card');
            const questionNumber = parseInt(questionCard.dataset.question);

            if (questionNumber === totalQuestions) {
                submitBtn.classList.remove('disabled');
                submitBtn.disabled = false;
                progressBar.style.width = '100%';
            } else if (currentQuestion < totalQuestions) {
                setTimeout(showNextQuestion, 500);
            }
        });
    });

    document.getElementById('quizForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const formData = new FormData(this);
        
        fetch(window.location.href, {
            method: 'POST',
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            if (data.next_url) {
                window.location.href = data.next_url;
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('There was an error submitting your answers. Please try again.');
        });
    });

    updateProgress();
});
</script>

<!-- Add Font Awesome for icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
{% endblock %}
