{% extends "base.html" %}

{% block additional_css %}
    <link rel="stylesheet" href="{{ url_for('static', filename='test_screen.css') }}">
{% endblock %}

{% block content %}
    <div class="content">
        <form method="POST" class="test-container" onsubmit="return validateForm()">
            {% for question in questions %}
            <div class="question-card">
                <p class="question-text">{{ question.question }}</p>
                <div class="button-group">
                    <button type="button" class="answer-btn yes-btn" 
                            onclick="selectAnswer(this, '{{ question.question }}', 'yes')">Yes</button>
                    <button type="button" class="answer-btn no-btn" 
                            onclick="selectAnswer(this, '{{ question.question }}', 'no')">No</button>
                </div>
                <input type="hidden" name="{{ question.question }}" id="input-{{ question.question }}">
            </div>
            {% endfor %}
            <button type="submit" class="submit-btn">Next</button>
        </form>
    </div>

    <script>
        function selectAnswer(btn, question, answer) {
            // Remove active class from all buttons in this group
            const parentCard = btn.closest('.question-card');
            parentCard.querySelectorAll('.answer-btn').forEach(button => {
                button.classList.remove('active');
            });
            
            // Add active class to clicked button
            btn.classList.add('active');
            
            // Set hidden input value
            document.getElementById('input-' + question).value = answer;
        }

        function validateForm() {
            const unanswered = document.querySelectorAll('.question-card').length - 
                             document.querySelectorAll('.answer-btn.active').length;
            if (unanswered > 0) {
                alert('Please answer all questions before proceeding.');
                return false;
            }
            return true;
        }
    </script>
{% endblock %}
