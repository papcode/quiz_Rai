{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header bg-success text-white">
                    <h2 class="text-center mb-0">Assessment Complete!</h2>
                </div>
                <div class="card-body text-center">
                    <div class="completion-message my-5">
                        <h4 class="mb-4">Thank you for completing the quiz!</h4>
                        <p class="lead">The results have been shared with your administrator for further analysis.</p>
                    </div>
                    
                    <div class="text-center mt-4">
                        <form action="{{ url_for('logout') }}" method="post">
                            <button type="submit" class="btn btn-primary">Return to Login</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .completion-message {
        padding: 2rem;
    }
    .lead {
        color: #495057;
    }
</style>
{% endblock %}
