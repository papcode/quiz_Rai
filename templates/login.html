{% extends "base.html" %}
{% block content %}
<div class="login-container">
    <div class="login-card">
        <div class="login-left">
            <div class="login-header">
                <h2>Welcome Back!</h2>
                <p>Please login to continue your journey</p>
            </div>
            <form method="POST" class="login-form">
                <div class="form-group">
                    <div class="input-group">
                        <i class="fas fa-user"></i>
                        <input type="text" id="student_id" name="student_id" placeholder="Student ID" required>
                    </div>
                </div>
                <div class="form-group">
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" name="password" placeholder="Password" required>
                        <i class="fas fa-eye-slash password-toggle" onclick="togglePassword()"></i>
                    </div>
                </div>
                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" name="remember">
                        <span>Remember me</span>
                    </label>
                    <a href="{{ url_for('auth.forgot_password') }}" class="forgot-link">Forgot Password?</a>
                </div>
                <button type="submit" class="login-btn">
                    <span>Login</span>
                    <i class="fas fa-arrow-right"></i>
                </button>
            </form>
            <div class="login-footer">
                <p>Don't have an account?</p>
                <a href="{{ url_for('auth.register') }}" class="register-link">Create Account</a>
            </div>
        </div>
        <div class="login-right">
            <div class="welcome-content">
                <h1>Quiz Application</h1>
                <p>Discover your personality type through our interactive quiz experience</p>
                <div class="decoration">
                    <div class="circle circle-1"></div>
                    <div class="circle circle-2"></div>
                    <div class="circle circle-3"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

.login-container {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    padding: 20px;
    font-family: 'Poppins', sans-serif;
}

.login-card {
    display: flex;
    background: white;
    border-radius: 20px;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
    overflow: hidden;
    width: 100%;
    max-width: 1000px;
    min-height: 600px;
}

.login-left {
    flex: 1;
    padding: 60px;
    display: flex;
    flex-direction: column;
}

.login-right {
    flex: 1;
    background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
    padding: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    position: relative;
    overflow: hidden;
}

.login-header h2 {
    font-size: 32px;
    color: #333;
    margin-bottom: 10px;
    font-weight: 600;
}

.login-header p {
    color: #666;
    margin-bottom: 40px;
}

.form-group {
    margin-bottom: 25px;
}

.input-group {
    position: relative;
    margin-bottom: 20px;
}

.input-group i {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
}

.input-group i:first-child {  /* Lock icon */
    left: 15px;
    color: #666;
}

.password-toggle {  /* Eye icon */
    right: 15px;
    cursor: pointer;
    color: #666;
}

.input-group input {
    width: 100%;
    padding: 12px 45px;  /* Increased right padding to accommodate both icons */
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 16px;
    transition: all 0.3s ease;
}

.form-options {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
}

.remember-me {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #666;
}

.forgot-link {
    color: #4CAF50;
    text-decoration: none;
    font-weight: 500;
}

.login-btn {
    width: 100%;
    padding: 15px;
    background: #4CAF50;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.3s;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
}

.login-btn:hover {
    background: #45a049;
    transform: translateY(-2px);
}

.login-footer {
    margin-top: auto;
    text-align: center;
}

.register-link {
    color: #4CAF50;
    text-decoration: none;
    font-weight: 600;
    margin-left: 5px;
}

.welcome-content {
    text-align: center;
    position: relative;
    z-index: 1;
}

.welcome-content h1 {
    font-size: 36px;
    margin-bottom: 20px;
    font-weight: 600;
}

.decoration {
    position: absolute;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
}

.circle {
    position: absolute;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.1);
}

.circle-1 {
    width: 200px;
    height: 200px;
    top: -100px;
    right: -100px;
}

.circle-2 {
    width: 150px;
    height: 150px;
    bottom: -75px;
    left: -75px;
}

.circle-3 {
    width: 100px;
    height: 100px;
    top: 50%;
    right: 10%;
}

@media (max-width: 768px) {
    .login-card {
        flex-direction: column;
    }
    
    .login-right {
        display: none;
    }
    
    .login-left {
        padding: 40px;
    }
}
</style>

<script>
function togglePassword() {
    const passwordInput = document.getElementById('password');
    const toggleIcon = document.querySelector('.password-toggle');
    
    if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        toggleIcon.classList.remove('fa-eye-slash');
        toggleIcon.classList.add('fa-eye');
    } else {
        passwordInput.type = 'password';
        toggleIcon.classList.remove('fa-eye');
        toggleIcon.classList.add('fa-eye-slash');
    }
}
</script>

<!-- Add Font Awesome for icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
{% endblock %}
