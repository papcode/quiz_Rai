{% extends "base.html" %}
{% block content %}
<div class="canvas-container">
    <div class="canvas-wrapper">
        <div class="quiz-header">
            <h2 class="quiz-title">Digital Signature</h2>
            <div class="quiz-header-line"></div>
        </div>

        <div class="signature-card">
            <div class="signature-area">
                <div class="signature-box">
                    <canvas id="signatureCanvas"></canvas>
                    <div class="signature-prompt" id="signaturePrompt">
                        <i class="fas fa-pen"></i>
                        <span>Sign Here</span>
                    </div>
                </div>
            </div>

            <div class="canvas-controls">
                <button id="clearBtn" class="control-btn clear-btn">
                    <i class="fas fa-eraser"></i>
                    <span>Clear</span>
                </button>
                <button id="saveBtn" class="control-btn save-btn" disabled>
                    <i class="fas fa-check"></i>
                    <span>Continue</span>
                </button>
            </div>
        </div>
    </div>
</div>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

.canvas-container {
    min-height: calc(100vh - 60px);
    background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    padding: 40px 20px;
    font-family: 'Poppins', sans-serif;
}

.canvas-wrapper {
    max-width: 800px;
    margin: 0 auto;
}

.quiz-header {
    text-align: center;
    margin-bottom: 40px;
    padding: 20px 0;
}

.quiz-title {
    font-size: 32px;
    color: #2e7d32;
    margin: 0;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    position: relative;
    display: inline-block;
}

.quiz-header-line {
    width: 60px;
    height: 3px;
    background: #4CAF50;
    margin: 15px auto 0;
    border-radius: 2px;
}

.signature-card {
    background: white;
    border-radius: 20px;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
    padding: 40px;
    margin-bottom: 30px;
}

.signature-area {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 30px;
}

.signature-box {
    position: relative;
    width: 100%;
    max-width: 600px;
    height: 300px;
    margin: 0 auto;
}

#signatureCanvas {
    width: 100%;
    height: 100%;
    border: 2px dashed #ddd;
    border-radius: 15px;
    cursor: crosshair;
    background: #fff;
    transition: all 0.3s ease;
}

#signatureCanvas:hover {
    border-color: #4CAF50;
    box-shadow: 0 5px 15px rgba(76, 175, 80, 0.1);
}

.signature-prompt {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #ccc;
    font-size: 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    pointer-events: none;
    opacity: 1;
    transition: opacity 0.3s ease;
}

.signature-prompt i {
    font-size: 24px;
}

.signature-prompt.hide {
    opacity: 0;
}

.canvas-controls {
    display: flex;
    gap: 20px;
    max-width: 600px;
    margin: 0 auto;
}

.control-btn {
    flex: 1;
    padding: 15px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
}

.clear-btn {
    background: #f8f9fa;
    color: #666;
    border: 2px solid #eee;
}

.clear-btn:hover {
    background: #eee;
    transform: translateY(-2px);
}

.save-btn {
    background: #4CAF50;
    color: white;
}

.save-btn:hover:not(:disabled) {
    background: #45a049;
    transform: translateY(-2px);
}

.save-btn:disabled {
    background: #cccccc;
    cursor: not-allowed;
    transform: none;
}

@media (max-width: 768px) {
    .signature-card {
        padding: 20px;
    }

    .signature-box {
        height: 200px;
    }

    .canvas-controls {
        flex-direction: column;
    }
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const canvas = document.getElementById('signatureCanvas');
    const clearBtn = document.getElementById('clearBtn');
    const saveBtn = document.getElementById('saveBtn');
    const prompt = document.getElementById('signaturePrompt');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;
    let hasSignature = false;

    // Set canvas size
    function resizeCanvas() {
        const box = canvas.parentElement;
        canvas.width = box.clientWidth;
        canvas.height = box.clientHeight;
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#2e7d32';
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
    }

    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // Drawing functions
    function startDrawing(e) {
        isDrawing = true;
        prompt.classList.add('hide');
        const pos = getPosition(e);
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
        e.preventDefault();
    }

    function draw(e) {
        if (!isDrawing) return;
        const pos = getPosition(e);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
        hasSignature = true;
        saveBtn.disabled = false;
        e.preventDefault();
    }

    function stopDrawing() {
        isDrawing = false;
        ctx.closePath();
    }

    function getPosition(e) {
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX || e.touches[0].clientX) - rect.left;
        const y = (e.clientY || e.touches[0].clientY) - rect.top;
        return { x, y };
    }

    // Event listeners
    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('mouseout', stopDrawing);

    // Touch events
    canvas.addEventListener('touchstart', startDrawing);
    canvas.addEventListener('touchmove', draw);
    canvas.addEventListener('touchend', stopDrawing);

    // Clear canvas
    clearBtn.addEventListener('click', function() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        hasSignature = false;
        saveBtn.disabled = true;
        prompt.classList.remove('hide');
    });

    // Save signature
    saveBtn.addEventListener('click', function() {
        if (!hasSignature) return;
        
        const signatureData = canvas.toDataURL('image/png');
        fetch('/save-signature', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ signature: signatureData })
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                window.location.href = data.redirect;
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('There was an error saving your signature. Please try again.');
        });
    });
});
</script>

<!-- Add Font Awesome for icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
{% endblock %}
